[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimir"
version = "0.1.0"
description = "Codebase structural health scanner"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "pytest",
]

[project.scripts]
mimir = "mimir.cli:main"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
preview = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "ANN", "UP", "A",
    "PLR0913", "PLR0915", "PLR1702",
    "SIM", "PERF", "PIE",
]
ignore = ["E501", "ANN401", "E111", "E114"]

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 70
max-branches = 12
max-nested-blocks = 4
