id: no-comments-python
language: python
severity: error
message: "no comments: only tool directives and EXTERNAL(...) citations"
rule:
  kind: comment
  not:
    any:
      - regex: '^#\s*EXTERNAL\('
      - matches: allowed-directive-python
---
