schema_version = "1.4"

[task]
name = "research-2/native-gen3ou-interpreter"
version = "0.1.0-review"
description = "Implement and verify a self-contained Gen 3 OU Ocean battle interpreter against pinned Pokemon Showdown"
keywords = ["c", "pokemon", "state-machine", "differential-testing", "pufferlib"]

[[task.authors]]
name = "research-2"

[metadata]
category = "systems-programming"
subcategory = "simulation-and-differential-testing"
harbor_version = "0.21.0"
difficulty_explanation = "Requires a bounded battle interpreter, a stable native ABI, and boundary-level conformance to an independent event-driven oracle."
solution_explanation = "A fixed-capacity scheduler and event interpreter over generated Gen 3 descriptors, with small named handlers for exceptional mechanics."
verification_explanation = "A separate hermetic verifier compares choices, queues, handlers, transitions, state, events, labeled PRNG draws, and terminal results to pinned Pokemon Showdown."
expert_time_estimate_hours = 160

[agent]
timeout_sec = 14400.0
network_mode = "no-network"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 4
memory_mb = 8192
storage_mb = 20480

[environment]
os = "linux"
build_timeout_sec = 1200.0
network_mode = "no-network"
cpus = 4
memory_mb = 8192
storage_mb = 20480

[[artifacts]]
source = "/app/robots/envs/dev/pokemon_gen3"
destination = "submission/pokemon_gen3"
