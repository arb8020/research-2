[project]
name = "kelpie-http"
version = "0.1.0"
description = "OpenAI-compatible /v1/completions over the kelpie-core submit/step/poll/cancel API"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "hypercorn>=0.17",
    "trio>=0.27",
    "tokenizers>=0.19",
    "kelpie-engine",
    "kelpie-models",
    "renderers>=0.1.10",
    "openai-harmony>=0.0.8",
    "transformers>=4.51",
]

[project.optional-dependencies]
eval = [
    "lm-eval[api]>=0.4",
]
# Kernel backends (kelpie_models/kernels/backends.py names these extras in its install hint).
# Linux-only: both are CUDA (FlashInfer's pinned cache wheels: x86_64 only). The Modal image
# installs both (kelpie_http/dev/remote.py, the image `kelpie remote` uses).
# OpenAI's MoE kernels from the triton repo at tag v3.7.1 (pinned by commit in [tool.uv.sources]);
# PyPI's `triton-kernels` is an unrelated project. Must match the locked triton (3.7.1).
triton-kernels = [
    "triton-kernels ; sys_platform == 'linux'",
]
# FlashInfer 0.7.0 + its prebuilt sm90a JIT cache (torch 2.13 is cu130; the image's nvcc is 12.4,
# so FlashInfer must not JIT). `flashinfer-jit-cache` is the provider-discovery stub flashinfer
# imports; its per-arch dependencies other than sm90a are dropped by override-dependencies below.
flashinfer = [
    "flashinfer-python==0.7.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.7.0+cu130 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache-sm90a==0.7.0+cu130 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
kelpie-engine = { path = "../kelpie-engine", editable = true }
kelpie-models = { path = "../kelpie-models", editable = true }
triton-kernels = { git = "https://github.com/triton-lang/triton.git", rev = "f797708c0626e5f9840ca5b0a98790e2c7cb09ad", subdirectory = "python/triton_kernels" }  # tag v3.7.1
flashinfer-jit-cache = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm90a = { index = "flashinfer-cu130" }

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130/"
explicit = true

[tool.uv]
# The stub requires every arch's cache (~1 GB); only sm90a is used (FlashInfer MoE is sm90-only
# here). An override whose marker can never hold (requires-python >= 3.11) removes a requirement.
override-dependencies = [
    "flashinfer-jit-cache-sm80 ; python_version < '3'",
    "flashinfer-jit-cache-sm89 ; python_version < '3'",
    "flashinfer-jit-cache-sm100a ; python_version < '3'",
    "flashinfer-jit-cache-sm103a ; python_version < '3'",
    "flashinfer-jit-cache-sm110a ; python_version < '3'",
    "flashinfer-jit-cache-sm120f ; python_version < '3'",
    "flashinfer-jit-cache-sm121a ; python_version < '3'",
]
# torch already locks cuda-bindings 13.3.1; the newest cuda-python (FlashInfer's dep) would drag it
# to 13.4.1 under every run, not just FlashInfer's. Hold it where torch had it.
constraint-dependencies = ["cuda-bindings==13.3.1"]
# flashinfer 0.7.0 was published 2026-09-22, inside the 8-day exclude-newer window; the user
# pinned it by name. The flashinfer.ai index publishes no upload times.
exclude-newer-package = { flashinfer-python = "2026-09-23T00:00:00Z", flashinfer-jit-cache = false, flashinfer-jit-cache-sm90a = false }

[project.scripts]
kelpie = "kelpie_http.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "transformers>=4.51",
    "torchvision>=0.28.0",
    "openai>=1.60",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelpie_http"]

[tool.pytest.ini_options]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "PLR",    # pylint refactor (too-many-args, nesting, statements, etc.)
    "PLW",    # pylint warnings
    "TRY",    # tryceratops (error channel hygiene)
    "RET",    # return hygiene (implicit None, superfluous return)
    "SIM",    # simplifications (suppress, ternary, etc.)
    "C901",   # McCabe cyclomatic complexity
    "ERA",    # commented-out code
    "PERF",   # perf antipatterns (try in loop, etc.)
    "BLE",    # blind/broad except
    "ANN401", # no `Any` in annotations
]
ignore = [
    "TRY003",  # long message at raise site — our style: inline motivation
    "RET505",  # superfluous else after return — sometimes clearer to keep
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-nested-blocks = 4
max-branches = 8

