[project]
name = "kelpie-engine"
version = "0.1.0"
description = "Python bindings for kelpie-core (ctypes over libkelpie) and the KelpieCore step loop"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
# kelpie-models + transformers: tests/test_qwen3_next_core.py drives a real torch model through
# the real core (the recurrent-state ring lives outside it); the engine tests need neither.
# transformers: tests/test_grammar.py's real xgrammar test needs a HF tokenizer
# (AutoTokenizer.from_pretrained) to exercise XGrammarMatcher against kelpie-core's vendored
# xgrammar shim -- see kelpie_engine/grammar.py. No pip `xgrammar` wheel dependency: grammar.py
# compiles through kelpie-core/xgrammar_shim's libxgrammar_shim (ctypes), built by
# kelpie-core/scripts/build_xgrammar.sh, not imported as a Python package.
dev = ["pytest>=8", "ruff>=0.6", "kelpie-models", "transformers>=4.51"]

[tool.uv.sources]
kelpie-models = { path = "../kelpie-models", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelpie_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "PLR",    # pylint refactor (too-many-args, nesting, statements, etc.)
    "PLW",    # pylint warnings
    "TRY",    # tryceratops (error channel hygiene)
    "RET",    # return hygiene (implicit None, superfluous return)
    "SIM",    # simplifications (suppress, ternary, etc.)
    "C901",   # McCabe cyclomatic complexity
    "ERA",    # commented-out code
    "PERF",   # perf antipatterns (try in loop, etc.)
    "BLE",    # blind/broad except
    "ANN401", # no `Any` in annotations
]
ignore = [
    "TRY003",  # long message at raise site — our style: inline motivation
    "RET505",  # superfluous else after return — sometimes clearer to keep
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-nested-blocks = 4
max-branches = 8

