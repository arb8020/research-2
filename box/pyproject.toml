[project]
name = "box"
version = "0.1.0"
description = "Rent a GPU machine, run jobs on it, bring results back, never leave it billing."
requires-python = ">=3.11"
dependencies = ["anyio>=4.10", "modal>=1.5", "requests", "research"]  # anyio: the Modal provider's loop (4.10: start_blocking_portal(name=))

[project.optional-dependencies]
dev = ["pytest", "jupyter_server~=2.17", "ipykernel~=7.1", "websockets>=13"]
# --provider colab: the official Colab CLI's modules (box/providers/colab.py reads their internals; pinned)
colab = ["google-colab-cli==0.7.4; python_version >= '3.12'"]  # it needs 3.12+

[project.scripts]
box = "box.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This directory IS the `box` package (box/__init__.py sits next to this file). hatchling, not
# setuptools: setuptools would execute a top-level setup.py here as a build script (box's kelpie
# setup lived at box/setup.py until it moved to box/kelpie/setup.py).
# The editable install puts the repo root on sys.path, which makes `box` (and `observe`)
# importable exactly as `PYTHONPATH=.` does for kelpie/scripts/modal_run.py.
[tool.hatch.build]
dev-mode-dirs = [".."]

# Only the editable install is supported: box runs from its checkout (and the same checkout is
# mounted into each sandbox), never as a published wheel.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
# `observe` (spans) ships in the repo-root project, named `research`.
research = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# archive/ is a record, not maintained: never collected, even by `pytest .` (the rest are pytest's defaults).
norecursedirs = ["archive", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
