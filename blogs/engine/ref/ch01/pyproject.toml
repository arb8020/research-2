[project]
name = "engine-ref-ch01"
version = "0.0.0"
description = "inference engine chapter 1: gpt2 forward (torch functional) + measurement vs HuggingFace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    # measure/ only (reference model + tokenizer); gpt2.py itself does not import transformers
    "transformers>=4.46",
    "tokenizers>=0.20",
]

[tool.uv]
package = false
