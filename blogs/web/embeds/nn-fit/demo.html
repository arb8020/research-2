<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nn-fit demo</title>
<link rel="icon" href="data:,">
<!-- Serve blogs/web (python3 -m http.server 8060 -d blogs/web) after `npm run build:nn-fit`, then open /embeds/nn-fit/demo.html -->
<script src="../../build/settings.js"></script>
<link rel="stylesheet" href="../../page.css">
<script type="module" src="../../build/nn-fit.js"></script>
<body>
<main>
  <article>
    <h1>Neural nets can fit functions</h1>
    <p>Draw a curve, press Train, and watch the network bend toward it. Switch the activation to linear: however many layers you stack, it can only draw a straight line.</p>
    <nn-fit id="draw"></nn-fit>
    <p>The same network on TensorFlow Playground's spiral.</p>
    <nn-fit id="spiral" dataset="spiral" activation="tanh" layers="3" width="8"></nn-fit>
  </article>
</main>
</body>
</html>
